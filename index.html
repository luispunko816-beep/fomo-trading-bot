<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FOMO AI TRADING</title>

<style>
body {
  background:#090d12;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

h1 {
  color:#00ff99;
}

input {
  width:90%;
  padding:15px;
  box-sizing:border-box;
  background:#17212b;
  color:white;
  border:1px solid #444;
  border-radius:10px;
  margin:10px;
}

button {
  width:90%;
  padding:15px;
  margin:10px;
  border:0;
  border-radius:10px;
  background:#00ff99;
  font-weight:bold;
}

#result {
  margin-top:20px;
  background:#17212b;
  padding:20px;
  border-radius:12px;
  text-align:left;
  overflow-wrap:anywhere;
}

.score {
  text-align:center;
  font-size:42px;
  font-weight:bold;
}

.green {
  color:#00ff99;
}

.red {
  color:#ff5555;
}

.yellow {
  color:#ffaa00;
}

.check {
  padding:10px;
  border-bottom:1px solid #333;
}
</style>
</head>

<body>

<h1>FOMO AI TRADING</h1>

<p>Solana Memecoin Analyzer</p>

<input
  id="tokenAddress"
  placeholder="Paste Solana Token Address"
>

<button id="analyzeButton">
ANALYZE TOKEN
</button>

<div id="result">
Enter a Solana token address
</div>

<script>

const button = document.getElementById("analyzeButton");
const result = document.getElementById("result");

async function analyzeToken() {

  const address =
    document.getElementById("tokenAddress").value.trim();

  if (!address) {
    result.textContent =
      "Please enter a Solana token address";
    return;
  }

  button.disabled = true;
  button.textContent = "SCANNING...";

  result.innerHTML =
    "<h2>Scanning token...</h2>";

  try {

    const dexResponse = await fetch(
      "https://api.dexscreener.com/token-pairs/v1/solana/" +
      encodeURIComponent(address)
    );

    if (!dexResponse.ok) {
      throw new Error(
        "DexScreener API error " +
        dexResponse.status
      );
    }

    const pairs = await dexResponse.json();

    if (!Array.isArray(pairs) || pairs.length === 0) {
      throw new Error(
        "No Solana trading pair found"
      );
    }

    const pair = pairs
      .filter(p =>
        p.baseToken &&
        p.baseToken.address === address
      )
      .sort((a,b) =>
        Number(b.liquidity?.usd || 0) -
        Number(a.liquidity?.usd || 0)
      )[0];

    if (!pair) {
      throw new Error("Token not found");
    }

    result.innerHTML =
      "<h2>Running RugCheck...</h2>";

    const rugResponse = await fetch(
      "https://api.rugcheck.xyz/v1/tokens/" +
      encodeURIComponent(address) +
      "/report/summary"
    );

    if (!rugResponse.ok) {
      throw new Error(
        "RugCheck API error " +
        rugResponse.status
      );
    }

    const rug = await rugResponse.json();

    let score = 0;
    let warnings = [];

    /*
      RugCheck can return different fields depending
      on the current API response.
    */

    if (
      rug.risks &&
      Array.isArray(rug.risks)
    ) {

      for (const risk of rug.risks) {

        if (
          risk.level === "danger"
        ) {
          score += 25;
          warnings.push(
            risk.name ||
            risk.description ||
            "High risk detected"
          );
        }

        else if (
          risk.level === "warn"
        ) {
          score += 10;
          warnings.push(
            risk.name ||
            risk.description ||
            "Warning detected"
          );
        }
      }
    }

    score = Math.min(score,100);

    let verdict =
      "LOW RISK";

    let verdictClass =
      "green";

    if (score >= 60) {

      verdict =
        "HIGH RISK";

      verdictClass =
        "red";

    } else if (score >= 30) {

      verdict =
        "MEDIUM RISK";

      verdictClass =
        "yellow";
    }

    const liquidity =
      Number(
        pair.liquidity?.usd || 0
      );

    const volume =
      Number(
        pair.volume?.h24 || 0
      );

    const change =
      Number(
        pair.priceChange?.h24 || 0
      );

    result.innerHTML = "";

    const title =
      document.createElement("h2");

    title.textContent =
      pair.baseToken?.name ||
      "Unknown Token";

    result.appendChild(title);

    const symbol =
      document.createElement("h3");

    symbol.textContent =
      pair.baseToken?.symbol ||
      "";

    result.appendChild(symbol);

    const price =
      document.createElement("p");

    price.textContent =
      "Price: $" +
      (pair.priceUsd || "N/A");

    result.appendChild(price);

    const liq =
      document.createElement("p");

    liq.textContent =
      "Liquidity: $" +
      liquidity.toLocaleString();

    result.appendChild(liq);

    const vol =
      document.createElement("p");

    vol.textContent =
      "24h Volume: $" +
      volume.toLocaleString();

    result.appendChild(vol);

    const ch =
      document.createElement("p");

    ch.textContent =
      "24h Change: " +
      change +
      "%";

    result.appendChild(ch);

    const heading =
      document.createElement("h2");

    heading.textContent =
      "RUG PULL RISK";

    result.appendChild(heading);

    const scoreElement =
      document.createElement("div");

    scoreElement.className =
      "score " +
      verdictClass;

    scoreElement.textContent =
      score + "/100";

    result.appendChild(scoreElement);

    const verdictElement =
      document.createElement("h2");

    verdictElement.className =
      verdictClass;

    verdictElement.style.textAlign =
      "center";

    verdictElement.textContent =
      verdict;

    result.appendChild(
      verdictElement
    );

    const warningHeading =
      document.createElement("h3");

    warningHeading.textContent =
      "Detected Risks";

    result.appendChild(
      warningHeading
    );

    if (warnings.length === 0) {

      const safe =
        document.createElement("p");

      safe.className =
        "green";

      safe.textContent =
        "No major RugCheck warnings returned";

      result.appendChild(safe);

    } else {

      warnings.forEach(warning => {

        const item =
          document.createElement("div");

        item.className =
          "check red";

        item.textContent =
          "⚠ " + warning;

        result.appendChild(item);

      });
    }

    const info =
      document.createElement("p");

    info.innerHTML =
      "<br>Important: This is an automated risk analysis. A 0/100 score does NOT prove that a token is safe.";

    result.appendChild(info);

    const link =
      document.createElement("a");

    link.href =
      pair.url;

    link.target =
      "_blank";

    link.rel =
      "noopener";

    link.textContent =
      "View on DexScreener";

    result.appendChild(link);

  }

  catch (error) {

    console.error(error);

    result.innerHTML =
      "<h2>Scanner Error</h2>" +
      "<p>" +
      error.message +
      "</p>";
  }

  finally {

    button.disabled = false;

    button.textContent =
      "ANALYZE TOKEN";
  }
}

button.addEventListener(
  "click",
  analyzeToken
);

</script>

</body>
</html>
