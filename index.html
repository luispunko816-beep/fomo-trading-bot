
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOMO AI Trading</title>
<style>
body {
  background: #090d12;
  color: white;
  font-family: Arial;
  text-align: center;
  padding: 30px;
}
h1 { color: #00ff99; }
input, button {
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
  width: 85%;
}
button {
  background: #00ff99;
  border: none;
  font-weight: bold;
}
#result {
  margin-top: 25px;
  background: #17212b;
  padding: 20px;
  border-radius: 12px;
}
</style>
</head>
<body>

<h1>FOMO AI TRADING</h1>
<p>Solana Memecoin Analyzer</p>

<input id="token" placeholder="Solana Token Address">

<br>
<button onclick="analyze()">ANALYZE COIN</button>
<button onclick="scanCoins()">SCAN SOLANA COINS</button>
<div id="result">Waiting for token...</div>

<script>
async function analyze() {
  const token = document.getElementById("token").value.trim();
  const result = document.getElementById("result");

  if (!token) {
    result.innerText = "Enter a token address";
    return;
  }

  result.innerText = "Analyzing...";

  try {
    const response = await fetch(
      "https://api.dexscreener.com/latest/dex/tokens/" + encodeURIComponent(token)
    );

    const data = await response.json();
    const pairs = (data.pairs || [])
      .filter(p => p.chainId === "solana")
      .sort((a,b) =>
        Number(b.liquidity?.usd || 0) -
        Number(a.liquidity?.usd || 0)
      );

    if (!pairs.length) {
      result.innerText = "No Solana trading pair found";
      return;
    }

    const p = pairs[0];

    result.innerHTML = `
      <h2>${p.baseToken.name}</h2>
      Price: $${p.priceUsd}<br>
      Market Cap: $${p.marketCap || "N/A"}<br>
      Liquidity: $${p.liquidity?.usd || 0}<br>
      24h Volume: $${p.volume?.h24 || 0}<br>
      24h Change: ${p.priceChange?.h24 || 0}%
      <h3>Analysis only</h3>
    `;
  } catch (e) {
    result.innerText = "Error loading data";
  }
}
</script>

</body>
</html>
