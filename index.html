
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOMO AI Trading</title>
<style>
body {
  background: #090d12;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 20px;
}
h1 { color: #00ff99; }
input, button {
  padding: 14px;
  margin: 10px 0;
  width: 90%;
  box-sizing: border-box;
  border-radius: 10px;
}
input { background: #17212b; color: white; border: 1px solid #444; }
button { background: #00ff99; border: 0; font-weight: bold; }
#result {
  margin-top: 20px;
  background: #17212b;
  padding: 18px;
  border-radius: 12px;
  overflow-wrap: anywhere;
}
.warning { color: #ff7777; }
.safe { color: #00ff99; }
</style>
</head>
<body>

<h1>FOMO AI TRADING</h1>
<p>Solana Token Risk Analyzer</p>

<input id="tokenAddress" placeholder="Paste Solana token address">

<button id="analyzeButton">ANALYZE TOKEN</button>

<div id="result">Enter a token address to begin</div>

<script>
const result = document.getElementById("result");
const button = document.getElementById("analyzeButton");

async function analyzeToken() {
  const address = document.getElementById("tokenAddress").value.trim();

  if (!address) {
    result.textContent = "Please enter a token address";
    return;
  }

  button.disabled = true;
  button.textContent = "ANALYZING...";
  result.textContent = "Loading token data...";

  try {
    const response = await fetch(
      "https://api.dexscreener.com/token-pairs/v1/solana/" +
      encodeURIComponent(address)
    );

    if (!response.ok) {
      throw new Error("API error: " + response.status);
    }

    const pairs = await response.json();

    if (!Array.isArray(pairs) || pairs.length === 0) {
      throw new Error("No trading pairs found");
    }

    const pair = pairs
      .filter(p => p.baseToken?.address === address)
      .sort((a, b) =>
        Number(b.liquidity?.usd || 0) -
        Number(a.liquidity?.usd || 0)
      )[0];

    if (!pair) throw new Error("Token not found");

    const liquidity = Number(pair.liquidity?.usd || 0);
    const volume = Number(pair.volume?.h24 || 0);
    const change = Number(pair.priceChange?.h24 || 0);
    const fdv = Number(pair.fdv || 0);

    const age = pair.pairCreatedAt
      ? (Date.now() - pair.pairCreatedAt) / 3600000
      : null;

    let risk = 0;
    const warnings = [];

    if (liquidity < 5000) {
      risk += 35;
      warnings.push("Very low liquidity");
    } else if (liquidity < 15000) {
      risk += 15;
      warnings.push("Low liquidity");
    }

    if (volume < 1000) {
      risk += 15;
      warnings.push("Very low 24h volume");
    }

    if (age !== null && age < 24) {
      risk += 20;
      warnings.push("Very new trading pair");
    }

    if (change < -50) {
      risk += 25;
      warnings.push("Large 24h price drop");
    }

    if (fdv > 0 && liquidity / fdv < 0.01) {
      risk += 15;
      warnings.push("Liquidity is very small compared to FDV");
    }

    risk = Math.min(risk, 100);

    let rating = "LOW MARKET RISK";
    if (risk >= 60) {
      rating = "HIGH MARKET RISK";
    } else if (risk >= 30) {
      rating = "MEDIUM MARKET RISK";
    }

    result.replaceChildren();

    function add(tag, text, className) {
      const el = document.createElement(tag);
      el.textContent = text;
      if (className) el.className = className;
      result.appendChild(el);
    }

    add("h2", pair.baseToken.name || "Unknown token");
    add("h3", pair.baseToken.symbol || "");
    add("p", "Price: $" + (pair.priceUsd || "N/A"));
    add("p", "Liquidity: $" + liquidity.toLocaleString());
    add("p", "24h Volume: $" + volume.toLocaleString());
    add("p", "24h Change: " + change + "%");
    add("p", "Market Cap: $" + Number(pair.marketCap || 0).toLocaleString());

    add("h2", "RUG PULL RISK CHECK");
    add("h1", risk + "/100");
    add("h2", rating, risk >= 60 ? "warning" : "safe");

    add("h3", "Warnings");

    if (warnings.length) {
      warnings.forEach(w => add("p", "⚠ " + w, "warning"));
    } else {
      add("p", "No major market-data warning found", "safe");
    }

    add("p",
      "Important: This score uses market data only. It cannot confirm or rule out a rug pull. Owner permissions, token authorities, holder concentration and liquidity lock were not checked."
    );

    const link = document.createElement("a");
    link.href = pair.url;
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "View on DexScreener";
    result.appendChild(link);

  } catch (error) {
    result.textContent = "Analysis Error: " + error.message;
  } finally {
    button.disabled = false;
    button.textContent = "ANALYZE TOKEN";
  }
}

button.addEventListener("click", analyzeToken);
</script>

</body>
</html>
